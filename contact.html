  <h1>Contact Me</h1>

  <div class="card">

      <label>Name</label><br>

      <label>Message</label><br>
      <textarea name="message" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #c7d2fe; height:150px;"></textarea><br><br>

      <button type="submit">Send Message</button>
